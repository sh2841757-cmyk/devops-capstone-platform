apiVersion: apps/v1
kind: Deployment
metadata:
  name: devops-capstone-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: devops-capstone-app
  template:
    metadata:
      labels:
        app: devops-capstone-app
    spec:
      containers:
        - name: app
          image: devops-capstone-app:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          readinessProbe:
            httpGet:
              path: /ready
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: "100m"
              memory: "64Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: devops-capstone-service
spec:
  selector:
    app: devops-capstone-app
  ports:
    - port: 80
      targetPort: 3000
  type: ClusterIP
