services:
  app:
    build: ./app
    container_name: devops-capstone-app
    ports:
      - "3000:3000"
    environment:
      APP_VERSION: "1.0.0"
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: devops-capstone-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - app
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.4.0
    container_name: devops-capstone-grafana
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: change-this-password
    volumes:
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  grafana-data:
